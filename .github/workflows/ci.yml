---
name: CI
on:
  pull_request:
  push:
    branches:
      - master
    # A push of documentation alone starts no run: no job reads Markdown (the browseSecrets
    # tests write their own guides). Instruction Markdown stays in.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actions-qa-ci:
    name: actions-qa-ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check the workflows with actions-qa-ci
        uses: LongTermSupport/actions-qa-ci@c692fb40e93f3ad63d59adf78a86d1a1d0111449  # v0.1.1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: "${{ github.repository }}"

      - name: Run Molecule tests
        uses: robertdebock/molecule-action@2.1.0

  unit-tests:
    name: Script unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ansible-vault and yq
        run: |
          pipx install ansible-core
          sudo wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod 0755 /usr/local/bin/yq
      - name: Run every tests/test-*.bash
        run: |
          set -euo pipefail
          for t in tests/test-*.bash; do
            echo "==> $t"
            bash "$t"
          done

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # XXX: we ignore the bash files that are included during execution from the list
    # files passed to shellcheck. See https://unix.stackexchange.com/questions/164025/exclude-one-pattern-from-glob-match
    # This still allows shellcheck to analyze them, but we don't pass them to shellcheck
    # as individual shell scripts; to avoid it from complaining of undefined variables
    - name: shellcheck
      run: |
        cd shellscripts
        GLOBIGNORE="_*.inc.bash"
        shellcheck -x *

  release:
    name: Release
    needs:
      - test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Publish to Ansible Galaxy
        uses: robertdebock/galaxy-action@1.0.3
        with:
          galaxy_api_key: ${{ secrets.ansible_galaxy_api_key }}

